[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-edu"
version = "0.4.0"
description = "Educational Blackjack with 24 probability-theory exercises, Hi-Lo counting, EV/HUD, terminal and Pygame interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pavel Galashin" }]
keywords = ["blackjack", "probability", "education", "monte-carlo", "card-counting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
blackjack = "main:main"
blackjack-backtest = "blackjack.backtest:main"

[tool.setuptools]
packages = ["blackjack", "blackjack.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E701/E702: enum classes use semicolons for one-line member lists by
#            design (Suit, Rank, Action, RoundOutcome, HandState, Ansi).
# E501:      long lines tolerated for ASCII card art and ANSI strings.
ignore = ["E501", "E701", "E702"]
